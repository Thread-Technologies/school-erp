<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<title>Log in - School ERP</title>
</head>
<body>
<div class="login-wrap">
  <section class="login-aside" aria-hidden="false">
    <h1>One place for the whole school day</h1>
    <p>Attendance, marks, homework and fees for teachers, students and parents.</p>
  </section>
  <main class="login-form-side">
    <form class="login-card" id="login-form" novalidate>
      <h2 class="h3 mb-1">Log in</h2>
      <p class="muted mb-4">Use the email and password given by your school.</p>
      <div class="alert alert-danger d-none" id="login-error" role="alert"></div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit" id="login-btn">Log in</button>
    </form>
  </main>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
